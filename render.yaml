services:
  - type: web
    name: student-gallery
    runtime: node
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: summeriva/student-gallery
      - key: GITHUB_BRANCH
        value: main
